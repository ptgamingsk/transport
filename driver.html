const defaultRules="Každý vodič používa vlastný účet. Heslo ani prístupové údaje neposkytuje iným osobám.\nNa jazdu možno použiť iba vozidlo, ktoré vodič vlastní v ETS2 alebo má dostupné v openOMSI a ktoré schválil riaditeľ.\nVodič zadáva pravdivé údaje o náklade, trase, kilometroch, príjmoch a výdavkoch. Neuvádza vymyslené dokončené jazdy.\nPri plnení zákazky dodržiava dopravné predpisy a jazdí bezpečne v rámci simulátora.\nNehody, poškodenie, pokuty, poruchy a zmenu trasy nahlási riaditeľovi.\nZákazku môže uzavrieť riaditeľ po overení vykonania jazdy. Telemetria sama osebe nie je dôkazom dokončenia.\nČlenovia sa správajú slušne a rešpektujú ostatných. Podvádzanie ani úmyselné poškodzovanie spoločnosti nie je povolené.\nTelemetria ETS2 je dobrovoľná a zaznamenáva len údaje z hry. Všetky sumy predstavujú hernú ekonomiku, nie skutočné peniaze.";

speed)+' km/h')+line('Palivo',number(telemetry.fuel)+' l')+line('Opotrebovanie motora',number(telemetry.damage)+' %')+line('Zákazka',[telemetry.source,telemetry.destination].filter(Boolean).join(' → ')||'—'):empty('Zatiaľ žiadne dáta.')))+panel('Prepojenie s hrou','<p>Program odosiela iba herné súradnice, rýchlosť, palivo, opotrebenie a údaje zákazky. Spustenie je dobrovoľné; zastaví sa Ctrl+C. Telemetria sama nepotvrdzuje dokončenie jazdy.</p><p><a href="telemetry/start-telemetry.cmd" download>Spúšťač Windows</a> · <a href="telemetry/ets2_bridge.py" download>Stiahnuť prepojovací program</a> · <a href="telemetry/setup.md">Návod</a></p>');if(page==='rules')h=title('Pravidlá spoločnosti','Interný poriadok PTGamingSK Transport')+panel('Povinnosti vodiča','<ol class="rules">'+String(member.rules||defaultRules).split('\n').map(t=>t.trim()).filter(Boolean).map(t=>'<li>'+esc(t)+'</li>').join('')+'</ol>')+'<p class="muted">Pravidlá upravuje riaditeľ. Ak si niečím nie si istý, obráť sa na vedenie spoločnosti.</p>'+rulesConfirmationMarkup();if(page==='home'){if(!rulesConfirmed())h='<div class="notice">Aktuálne pravidlá ešte nemáš potvrdené. <button class="secondary" data-page="rules">Prečítať a potvrdiť</button></div>'+h;if(driverAnnouncements?.length)h='<div class="notice">Firemný oznam: '+esc(driverAnnouncements[0].title)+' <button class="secondary" data-page="announcements">Zobraziť oznamy</button></div>'+h}$('view').innerHTML=h;}
let portalMaintenance=null,maintenancePollBusy=false;
function maintenanceActive(){return portalMaintenance&&portalMaintenance.start<=clockNow()&&clockNow()<portalMaintenance.end&&portalMaintenance.block===true}
function showMaintenance(){const b=$('maintenanceBanner'),m=portalMaintenance,now=clockNow();b.hidden=!m||m.end<=now;if(!b.hidden){const active=m.start<=now;const fmt=n=>new Date(n).toLocaleString('sk-SK',{timeZone:'Europe/Bratislava'});b.textContent=(active?'PREBIEHA ÚDRŽBA':'PLÁNOVANÁ ODSTÁVKA')+' · '+m.reason+' · '+fmt(m.start)+' – '+fmt(m.end)+(active&&m.block?' · Portál bude po údržbe automaticky dostupný.':'')}if(member)$('content').hidden=!!maintenanceActive()}
async function pollMaintenance(){const user=auth.currentUser;if(!user||!member||maintenancePollBusy)return;maintenancePollBusy=true;try{const p=await getDocFromServer(doc(db,'portalStatus','maintenance'));if(auth.currentUser?.uid!==user.uid||!member)return;const m=p.data();portalMaintenance=m&&Number.isFinite(m.start)&&Number.isFinite(m.end)?m:null;showMaintenance()}catch{/* zachovaj posledný známy stav */}finally{maintenancePollBusy=false}}
setInterval(()=>{if(member){showMaintenance();pollMaintenance()}},15000);
async function load(user){const e=++epoch;busy=true;$('logout').hidden=false;$('login').hidden=true;$('refresh').disabled=true;msg('Načítavam vlastné údaje…');try{const p=await getDocFromServer(doc(db,'driverAccounts',user.uid));if(e!==epoch)return;if(!p.exists()||p.data().enabled!==true)throw Error('disabled');const [t,q,a,b]=await Promise.allSettled([p.data().division==='openOMSI'?Promise.resolve({data:()=>null}):getDocFromServer(doc(db,'driverTelemetry',user.uid)),getDocFromServer(doc(db,'driverReports',user.uid)),getDocFromServer(doc(db,'rulesReceipts',user.uid)),getDocFromServer(doc(db,'portalStatus','announcements'))]);if(e!==epoch)return;member=p.data();loadEventSeen();if(member.division==='openOMSI'){telemetry=null;if(!allowedPage(page))page='home'}rulesReceipt=a.status==='fulfilled'?a.value.data()||null:null;driverAnnouncements=b.status==='fulfilled'?(b.value.data()?.items||[]):null;telemetry=t.status==='fulfilled'?t.value.data()||null:null;report=q.status==='fulfilled'?q.value.data()||null:null;$('content').hidden=false;$('driverPill').hidden=false;$('refresh').hidden=false;render();startNoticeWatch(user.uid);showMaintenance();await pollMaintenance();if(page==='announcements')markAnnouncementsRead();if(e===epoch)msg('Údaje vodiča načítané.')}catch{if(e!==epoch)return;clear();msg('Účet nie je povolený alebo údaje nie sú dostupné. Kontaktuj riaditeľa.',true)}finally{if(e===epoch){busy=false;$('refresh').disabled=false}}}
$('sidebarLogo').src=$('login').querySelector('img').src;
onAuthStateChanged(auth,u=>{clear();page='home';$('submit').disabled=false;if(u)load(u);else{$('login').hidden=false;$('logout').hidden=true;msg('Prihlás sa svojím účtom.')}},()=>{clear();msg('Prihlasovanie nie je dostupné.',true)});
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('submit').disabled=true;const f=new FormData(e.target);try{await signInWithEmailAndPassword(auth,String(f.get('email')).trim(),String(f.get('password')));e.target.reset()}catch{msg('Prihlásenie sa nepodarilo.',true)}finally{$('submit').disabled=false}});
$('logout').onclick=async()=>{clear();try{await signOut(auth)}catch{msg('Odhlásenie zlyhalo.',true)}};
$('refresh').onclick=()=>{if(auth.currentUser&&!busy)load(auth.currentUser)};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&page==='announcements')markAnnouncementsRead()});setInterval(()=>{if(!document.hidden&&auth.currentUser&&member&&!busy&&page!=='reports')load(auth.currentUser)},60000);
$('content').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(!b||!member||busy||maintenanceActive()||!pages[b.dataset.page]||!allowedPage(b.dataset.page))return;page=b.dataset.page;render();markEvent(page);if(page==='announcements')markAnnouncementsRead();window.scrollTo(0,0)});
$('content').addEventListener('submit',async e=>{if(e.target.id==='rulesReceiptForm'){e.preventDefault();if(!member||!auth.currentUser||busy||maintenanceActive()||!new FormData(e.target).has('ack'))return;const u=auth.currentUser.uid,token=epoch;busy=true;const btn=e.target.querySelector('button');btn.disabled=true;try{const ref=doc(db,'rulesReceipts',u);await setDoc(ref,{version:member.rulesVersion||'initial',rules:String(member.rules||defaultRules),at:serverTimestamp()});const p=await getDocFromServer(ref);if(token===epoch){rulesReceipt=p.data();render();msg('Potvrdenie pravidiel uložené.')}}catch{if(token===epoch)msg('Potvrdenie sa nepodarilo uložiť. Obnov údaje a skús znova.',true)}finally{if(token===epoch){busy=false;btn.disabled=false}}return}if(e.target.id!=='reportForm')return;e.preventDefault();if(!member||!auth.currentUser||busy||maintenanceActive())return;const f=new FormData(e.target),u=auth.currentUser.uid,token=epoch;busy=true;const btn=e.target.querySelector('button');btn.disabled=true;try{const data={sim:f.get('sim'),vehicle:String(f.get('vehicle')).trim(),place:String(f.get('place')).trim(),note:String(f.get('note')).trim()};if(!data.vehicle||!data.place)throw Error('empty');await setDoc(doc(db,'driverReports',u),{...data,updated:serverTimestamp()});if(token===epoch){const q=await getDocFromServer(doc(db,'driverReports',u));if(token!==epoch)return;report=q.data();render();msg('Hlásenie uložené.')}}catch{if(token===epoch)msg('Hlásenie sa nepodarilo uložiť. Skontroluj údaje a prístup.',true)}finally{if(token===epoch){busy=false;btn.disabled=false}}});
let clockAnchor=null,clockUser=null,clockBusy=false;const clockNow=()=>clockAnchor?clockAnchor.ms+performance.now()-clockAnchor.tick:Date.now();const clockFormat=new Intl.DateTimeFormat('sk-SK',{timeZone:'Europe/Bratislava',weekday:'short',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});function drawClock(){const el=document.getElementById('portalClock');el.textContent=clockFormat.format(clockNow());el.title=clockAnchor?'Synchronizovaný čas SR':'Miestne hodiny bez synchronizácie'}async function syncClock(){const u=auth.currentUser;if(!u||clockBusy)return;clockBusy=true;try{const ref=doc(db,'clockSync',u.uid),start=performance.now();await setDoc(ref,{at:serverTimestamp()});const written=performance.now(),p=await getDocFromServer(ref),ms=p.data()?.at?.toMillis();if(auth.currentUser?.uid===u.uid&&clockUser===u.uid&&Number.isFinite(ms)){clockAnchor={ms,tick:(start+written)/2};drawClock()}}catch{}finally{clockBusy=false}}onAuthStateChanged(auth,u=>{clockUser=u?.uid||null;clockAnchor=null;drawClock();if(u)syncClock()});setInterval(drawClock,1000);setInterval(()=>{if(!document.hidden)syncClock()},300000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncClock()});drawClock();
</script></body></html>
