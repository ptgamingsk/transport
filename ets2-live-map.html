<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ETS2 WOLF DISPATCH</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"><style>html,body,#map{height:100%;margin:0;background:#151e1c;color:#e5eee7;font:14px system-ui}#status{position:absolute;z-index:2;top:10px;left:10px;max-width:75%;padding:8px 12px;border-radius:6px;background:#17231fee;border:1px solid #536a55} .truck{border:2px solid currentColor;border-radius:8px;background:#14201b;color:#99f52f;padding:5px 8px;white-space:nowrap;cursor:pointer;font:bold 12px system-ui;box-shadow:0 2px 6px #000}.maplibregl-popup-content{background:#19251f;color:#eef6e9}.maplibregl-popup-tip{border-top-color:#19251f!important}.maplibregl-ctrl-attrib{font-size:10px}</style></head><body><div id="map"></div><div id="status">Načítavam herné cesty ETS2…</div><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.11.0/proj4.js"></script><script>
const status=document.getElementById('status');let map,rows=[],markers=new Map(),initialFocus=false;
const palette={moving:'#99f52f',stopped:'#e5bc70',offline:'#a0adaa',out:'#a0adaa'};
function project(x,z){const sx=Math.floor(x/4000),sy=Math.floor(z/4000);x-=16660;z-=4150;if(sx<=-8&&sy<=-2&&!(sx===-8&&sy===-2)&&sy>=-14){x=(x-15550)*.75;z=(z-2750)*.75}const d=6370997*Math.PI/180;return proj4('+proj=lcc +R=6370997 +lat_1=37 +lat_2=65 +lat_0=50 +lon_0=15','EPSG:4326',[x*.0001729241463*d,z*-.000171570875*d])}
function update(){if(!map)return;const keep=new Set();for(const t of rows){if(!t.connected||!Number.isFinite(t.x)||!Number.isFinite(t.z))continue;let p;try{p=project(t.x,t.z)}catch{continue}if(!p.every(Number.isFinite)||Math.abs(p[0])>180||Math.abs(p[1])>85)continue;keep.add(t.uid);let m=markers.get(t.uid);if(!m){const el=document.createElement('button');el.className='truck';el.type='button';m=new maplibregl.Marker({element:el}).setLngLat(p).addTo(map);markers.set(t.uid,m)}const el=m.getElement();el.style.color=palette[t.state]||palette.offline;el.textContent='🚚 '+t.name+' · '+t.speed;m.setLngLat(p);const detail=document.createElement('div');for(const line of [t.name,t.stateLabel+' · '+t.speed,t.truck,'Palivo: '+t.fuel,'Motor: '+t.damage,'Zákazka: '+t.job]){const div=document.createElement('div');div.textContent=line;detail.append(div)}let popup=m.getPopup();if(!popup){popup=new maplibregl.Popup({offset:18});m.setPopup(popup)}popup.setDOMContent(detail);if(!initialFocus&&t.state!=='offline'){initialFocus=true;map.jumpTo({center:p,zoom:8})}}
for(const [id,m] of markers)if(!keep.has(id)){m.remove();markers.delete(id)}}
window.addEventListener('message',e=>{if(e.source!==parent||e.origin!==location.origin||!e.data||e.data.type!=='ptg-map-telemetry'||!Array.isArray(e.data.rows))return;rows=e.data.rows;update();if(e.data.focus){const m=markers.get(e.data.focus);if(m)map?.flyTo({center:m.getLngLat(),zoom:10})}});
try{maplibregl.addProtocol('pmtiles',new pmtiles.Protocol().tile);const root='https://maps.truckermudgeon.com';const roadFilter=['all',['==',['get','type'],'road'],['!=',['get','roadType'],'train'],['!=',['get','hidden'],true]];const style={version:8,glyphs:'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',sources:{world:{type:'vector',url:'pmtiles://'+root+'/world.pmtiles',attribution:'Natural Earth'},ets2:{type:'vector',url:'pmtiles://'+root+'/ets2.pmtiles',attribution:'TruckSim Maps · Trucker Mudgeon / SCS Software'}},layers:[{id:'bg',type:'background',paint:{'background-color':'#26312c'}},{id:'water',type:'fill',source:'world','source-layer':'water',paint:{'fill-color':'#101d27'}},{id:'borders',type:'line',source:'world','source-layer':'countries',paint:{'line-color':'#718078','line-width':1}},{id:'areas',type:'fill',source:'ets2','source-layer':'ets2',filter:['all',['==',['geometry-type'],'Polygon'],['in',['get','type'],['literal',['mapArea','prefab']]]],paint:{'fill-color':'#49564c','fill-opacity':.6}},{id:'roads-outline',type:'line',source:'ets2','source-layer':'ets2',filter:roadFilter,layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#111915','line-width':['interpolate',['linear'],['zoom'],4,1.5,8,4,13,12]}},{id:'roads',type:'line',source:'ets2','source-layer':'ets2',filter:roadFilter,layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#dbbd71','line-width':['interpolate',['linear'],['zoom'],4,.8,8,2,13,8]}},{id:'ferries',type:'line',source:'ets2','source-layer':'ets2',filter:['==',['get','type'],'ferry'],paint:{'line-color':'#7da7bf','line-width':1.5,'line-dasharray':[2,2]}},{id:'cities',type:'symbol',source:'ets2','source-layer':'ets2',filter:['==',['get','type'],'city'],layout:{'text-field':['get','name'],'text-font':['Open Sans Regular'],'text-size':['interpolate',['linear'],['zoom'],4,10,9,14]},paint:{'text-color':'#f0f3e7','text-halo-color':'#15211a','text-halo-width':1.5}}]};map=new maplibregl.Map({container:'map',style,center:[14,51],zoom:4.7,minZoom:3,maxZoom:15,renderWorldCopies:false});map.addControl(new maplibregl.NavigationControl(),'top-right');map.on('error',e=>{status.textContent='Chyba mapy: '+(e.error?.message||String(e.error||'Neznáma chyba'));console.error(e.error)});map.on('load',()=>{status.textContent='ETS2 · herná cestná sieť';update()});}catch(e){status.textContent='Mapu sa nepodarilo inicializovať: '+e.message}
</script></body></html>
