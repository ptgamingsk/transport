<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ETS2 WOLF DISPATCH</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"><style>html,body,#map{height:100%;margin:0;background:#151e1c;color:#e5eee7;font:14px system-ui}#status{position:absolute;z-index:2;top:10px;left:10px;max-width:75%;padding:8px 12px;border-radius:6px;background:#17231fee;border:1px solid #536a55} .truck{border:2px solid currentColor;border-radius:8px;background:#14201b;color:#99f52f;padding:5px 8px;white-space:nowrap;cursor:pointer;font:bold 12px system-ui;box-shadow:0 2px 6px #000}.maplibregl-popup-content{background:#19251f;color:#eef6e9}.maplibregl-popup-tip{border-top-color:#19251f!important}.maplibregl-ctrl-attrib{font-size:10px} .mapbar{position:absolute;z-index:3;left:10px;bottom:30px;background:#17231fee;border:1px solid #536a55;padding:10px;border-radius:8px;max-width:85%}.mapbar button,.mapbar select{background:#26382c;color:#e5eee7;border:1px solid #536a55;border-radius:5px;padding:7px;margin:3px;cursor:pointer}.mapbar summary{cursor:pointer;color:#a6e878}.mapbar label{display:block;margin:5px 0}.mapbar input{max-width:180px}</style></head><body><div id="map"></div><div id="status">Vyber vlastné herné mapové podklady.</div><div class="mapbar"><button id="overview">Celá Európa</button><select id="follow"><option value="">Nesledovať vodiča</option></select><details id="fileOptions"><summary>Mapové podklady</summary><label>ETS2 cesty <input id="gameFile" type="file" accept=".pmtiles"></label><br><label>Hranice (voliteľné) <input id="worldFile" type="file" accept=".pmtiles"></label><br><button id="loadFiles" type="button">Načítať mapu</button> <a href="./map-data/README.md" target="_blank" style="color:#99f52f">Návod</a></details></div><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.11.0/proj4.js"></script><script>
const status=document.getElementById('status');let map,rows=[],markers=new Map(),initialFocus=false;const follow=document.getElementById("follow");let followId="";const europe=[[ -10.025698,34.897275],[33.284941,71.573102]];function overview(){map?.fitBounds(europe,{padding:30,duration:500,maxZoom:5});}
const palette={moving:'#99f52f',stopped:'#e5bc70',offline:'#a0adaa',out:'#a0adaa'};
function project(x,z){const sx=Math.floor(x/4000),sy=Math.floor(z/4000);x-=16660;z-=4150;if(sx<=-8&&sy<=-2&&!(sx===-8&&sy===-2)&&sy>=-14){x=(x-15550)*.75;z=(z-2750)*.75}const d=6370997*Math.PI/180;return proj4('+proj=lcc +R=6370997 +lat_1=37 +lat_2=65 +lat_0=50 +lon_0=15','EPSG:4326',[x*.0001729241463*d,z*-.000171570875*d])}
function update(){if(!map)return;const keep=new Set();const active=rows.filter(t=>t.connected&&["moving","stopped"].includes(t.state));const key=JSON.stringify(active.map(t=>[t.uid,t.name]));if(follow.dataset.key!==key){follow.dataset.key=key;follow.replaceChildren(new Option("Nesledovať vodiča",""),...active.map(t=>new Option(t.name,t.uid)));if(!active.some(t=>t.uid===followId))followId="";follow.value=followId;}for(const t of rows){if(!t.connected||!Number.isFinite(t.x)||!Number.isFinite(t.z))continue;let p;try{p=project(t.x,t.z)}catch{continue}if(!p.every(Number.isFinite)||Math.abs(p[0])>180||Math.abs(p[1])>85)continue;keep.add(t.uid);let m=markers.get(t.uid);if(!m){const el=document.createElement('button');el.className='truck';el.type='button';m=new maplibregl.Marker({element:el}).setLngLat(p).addTo(map);markers.set(t.uid,m)}const el=m.getElement();el.style.color=palette[t.state]||palette.offline;el.textContent='🚚 '+t.name+' · '+t.speed;m.setLngLat(p);const detail=document.createElement('div');for(const line of [t.name,t.stateLabel+' · '+t.speed,t.truck,'Palivo: '+t.fuel,'Motor: '+t.damage,'Zákazka: '+t.job]){const div=document.createElement('div');div.textContent=line;detail.append(div)}let popup=m.getPopup();if(!popup){popup=new maplibregl.Popup({offset:18});m.setPopup(popup)}popup.setDOMContent(detail);if(followId===t.uid&&['moving','stopped'].includes(t.state)){map.easeTo({center:p,duration:500})}}
for(const [id,m] of markers)if(!keep.has(id)){m.remove();markers.delete(id)}}
window.addEventListener('message',e=>{if(e.source!==parent||e.origin!==location.origin||!e.data||e.data.type!=='ptg-map-telemetry'||!Array.isArray(e.data.rows))return;rows=e.data.rows;update();if(e.data.focus){const m=markers.get(e.data.focus);if(m)map?.flyTo({center:m.getLngLat(),zoom:10})}});

async function buildRoadOverview(gameUrl,target){
 const [{VectorTile},{default:Pbf}]=await Promise.all([import('https://esm.sh/@mapbox/vector-tile@1.3.1'),import('https://esm.sh/pbf@3.2.1')]);
 const archive=protocol.get(gameUrl)||new pmtiles.PMTiles(gameUrl),z=4,n=2**z;
 const lonX=lon=>Math.floor((lon+180)/360*n),latY=lat=>Math.floor((1-Math.asinh(Math.tan(lat*Math.PI/180))/Math.PI)/2*n);
 const h=await archive.getHeader(),tasks=[];
 for(let x=Math.max(0,lonX(h.minLon));x<=Math.min(n-1,lonX(h.maxLon));x++)for(let y=Math.max(0,latY(h.maxLat));y<=Math.min(n-1,latY(h.minLat));y++)tasks.push([x,y]);
 const lines={freeway:[],divided:[],local:[]},cities=new Map(),seen=new Set();
 for(const [x,y] of tasks){
  const res=await archive.getZxy(z,x,y);if(!res)continue;
  const layer=new VectorTile(new Pbf(new Uint8Array(res.data))).layers.ets2;if(!layer)continue;
  for(let i=0;i<layer.length;i++){
   const f=layer.feature(i),p=f.properties;
   if(p.type==='city'&&f.type===1&&p.name){const g=f.toGeoJSON(x,y,z);if(g.geometry.type==='Point'&&!cities.has(p.name))cities.set(p.name,{type:'Feature',geometry:g.geometry,properties:{name:p.name,rank:Number(p.scaleRank??10)}});continue}
   if(p.type!=='road'||p.hidden===true||p.hidden===1||f.type!==2||!['freeway','divided','local'].includes(p.roadType))continue;
   const g=f.toGeoJSON(x,y,z).geometry,parts=g.type==='LineString'?[g.coordinates]:g.type==='MultiLineString'?g.coordinates:[];
   for(const part of parts){const q=[];for(const v of part){const a=[Math.round(v[0]*1000)/1000,Math.round(v[1]*1000)/1000];if(!q.length||a[0]!==q[q.length-1][0]||a[1]!==q[q.length-1][1])q.push(a)}if(q.length<2)continue;
    const k=q.map(a=>a.join(',')).join(';'),rev=q.slice().reverse().map(a=>a.join(',')).join(';');if(seen.has(k)||seen.has(rev))continue;seen.add(k);lines[p.roadType].push(q)}
  }
 }
 if(map!==target)return;
 const roadFeatures=Object.entries(lines).filter(([,v])=>v.length).map(([kind,coordinates])=>({type:'Feature',properties:{kind},geometry:{type:'MultiLineString',coordinates}}));
 if(!roadFeatures.length)throw Error('Prehľadová vrstva neobsahuje cesty');
 target.getSource('road-overview').setData({type:'FeatureCollection',features:roadFeatures});
 target.getSource('city-overview').setData({type:'FeatureCollection',features:[...cities.values()]});
 status.textContent='ETS2 · herná cestná sieť · prehľad pripravený';
}

const protocol=new pmtiles.Protocol();maplibregl.addProtocol('pmtiles',protocol.tile);function startMap(gameUrl,worldUrl){try{if(map){for(const m of markers.values())m.remove();markers.clear();map.remove();map=null;initialFocus=false}const roadFilter=['all',['==',['get','type'],'road'],['!=',['get','roadType'],'train'],['!=',['get','hidden'],true]];const style={version:8,glyphs:'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',sources:{world:{type:'vector',url:'pmtiles://'+worldUrl,attribution:'Natural Earth'},ets2:{type:'vector',url:'pmtiles://'+gameUrl,attribution:'TruckSim Maps · Trucker Mudgeon / SCS Software'}},layers:[{id:'bg',type:'background',paint:{'background-color':'#202824'}},{id:'water',type:'fill',source:'world','source-layer':'water',paint:{'fill-color':'#101d27'}},{id:'borders',type:'line',source:'world','source-layer':'countries',paint:{'line-color':'#718078','line-width':1}},{id:'areas',type:'fill',source:'ets2','source-layer':'ets2',filter:['all',['==',['geometry-type'],'Polygon'],['in',['get','type'],['literal',['mapArea','prefab']]]],paint:{'fill-color':'#49564c','fill-opacity':.6}},{id:'roads-outline',type:'line',source:'ets2','source-layer':'ets2',filter:roadFilter,layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#111915','line-width':['interpolate',['linear'],['zoom'],4,1.5,8,4,13,12]}},{id:'roads',type:'line',source:'ets2','source-layer':'ets2',filter:roadFilter,layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':['match',['get','roadType'],'freeway','#e6bd65','divided','#d6bd89','local','#a9aaa0','#8c958d'],'line-width':['interpolate',['linear'],['zoom'],4,1.3,6,1.8,8,2.8,13,8]}},{id:'ferries',type:'line',source:'ets2','source-layer':'ets2',filter:['==',['get','type'],'ferry'],paint:{'line-color':'#7da7bf','line-width':1.5,'line-dasharray':[2,2]}},{id:'cities',type:'symbol',source:'ets2','source-layer':'ets2',filter:['==',['get','type'],'city'],layout:{'text-field':['get','name'],'text-font':['Open Sans Regular'],'text-size':['interpolate',['linear'],['zoom'],4,11,9,15],'symbol-sort-key':['coalesce',['get','scaleRank'],10]},paint:{'text-color':'#f0f3e7','text-halo-color':'#15211a','text-halo-width':1.5}}]};if(!worldUrl){delete style.sources.world;style.layers=style.layers.filter(l=>l.source!=='world')}const empty={type:'FeatureCollection',features:[]};style.sources['road-overview']={type:'geojson',data:empty,maxzoom:7,tolerance:1};style.sources['city-overview']={type:'geojson',data:empty,maxzoom:7};const detailLayers=style.layers.filter(l=>l.source==='ets2');for(const l of detailLayers)l.minzoom=7;style.layers.push({id:'overview-local',type:'line',source:'road-overview',maxzoom:7,filter:['==',['get','kind'],'local'],layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#758179','line-width':['interpolate',['linear'],['zoom'],3,.35,6,1.1],'line-opacity':.6}},{id:'overview-main',type:'line',source:'road-overview',maxzoom:7,filter:['in',['get','kind'],['literal',['freeway','divided']]],layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#e6bd65','line-width':['interpolate',['linear'],['zoom'],3,.8,6,2.1]}},{id:'overview-cities',type:'symbol',source:'city-overview',maxzoom:7,filter:['<=',['get','rank'],6],layout:{'text-field':['get','name'],'text-font':['Open Sans Regular'],'text-size':11,'symbol-sort-key':['get','rank']},paint:{'text-color':'#e5eee7','text-halo-color':'#202824','text-halo-width':1}});map=new maplibregl.Map({container:'map',style,center:[12,53],zoom:5,minZoom:3,maxZoom:15,renderWorldCopies:false});map.addControl(new maplibregl.NavigationControl(),'top-right');map.on('error',e=>{status.textContent='Chyba mapy: '+(e.error?.message||String(e.error||'Neznáma chyba'));console.error(e.error)});map.on('load',()=>{const target=map;status.textContent='Pripravujem prehľad hlavných ciest…';update();buildRoadOverview(gameUrl,target).catch(e=>{if(map!==target)return;for(const l of detailLayers)target.setLayerZoomRange(l.id,4,24);status.textContent='Prehľad sa nepodarilo pripraviť: '+e.message+' · detailná mapa zostáva dostupná';console.error(e)})});map.on('dragstart',()=>{followId='';follow.value=''});}catch(e){status.textContent='Mapu sa nepodarilo inicializovať: '+e.message}}
document.getElementById('overview').onclick=()=>{followId='';follow.value='';overview()};follow.onchange=()=>{followId=follow.value;const m=markers.get(followId);if(m)map?.easeTo({center:m.getLngLat(),zoom:8,duration:500})};
async function registerFile(file){const p=new pmtiles.PMTiles(new pmtiles.FileSource(file));await p.getHeader();protocol.add(p);return file.name}
document.getElementById('loadFiles').addEventListener('click',async()=>{try{const g=document.getElementById('gameFile').files[0],w=document.getElementById('worldFile').files[0];if(!g)throw Error('Vyber ets2.pmtiles');if(w&&w.name===g.name)throw Error('Vyber dva rôzne súbory');const game=await registerFile(g),world=w?await registerFile(w):null;startMap(game,world)}catch(e){status.textContent='Chyba súboru: '+e.message}});
(async()=>{try{const g=new URL('./map-data/ets2.pmtiles',location.href).href,w=new URL('./map-data/world.pmtiles',location.href).href;const p=new pmtiles.PMTiles(g);await p.getHeader();let world=null;try{await new pmtiles.PMTiles(w).getHeader();world=w}catch{}startMap(g,world)}catch{document.getElementById('fileOptions').open=true;status.textContent='Vlastné podklady ešte nie sú uložené na webe. Vyber ets2.pmtiles zo svojho PC.'}})();
</script></body></html>
